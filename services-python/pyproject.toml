[project]
name = "aurix-py"
version = "1.0.1"
description = "AURIX Python workspace — Phase 1 stubs only (no prod agents/training)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3", "joblib>=1.3", "pyyaml>=6"]

[project.scripts]
aurix-train = "aurix_ai.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
