# AURIX AI policy v1 — Qwen/Laya/market-ML/training configuration.
# Model names are configurable here; application code must not hardcode them.
# Training/AI never enables live trading (safety.allow_live equivalent: promotion gates).
version: ai-policy-v1

llm:
  provider: ollama
  model: qwen3:4b
  endpoint: http://127.0.0.1:11434
  timeout_ms: 120000
  generation:
    temperature: 0.2
    max_tokens: 512
  allowed_callers:
    - research-agents
    - analyst-assistant
  # Qwen is reasoning/synthesis only; NEVER authoritative for risk/execution/margin/kill-switches.

laya:
  model: convaiinnovations/laya
  device_policy: auto  # auto | cpu | cuda (auto uses GPU only when resource checks pass)
  max_len: 512
  min_confidence: null
  max_vram_mb: 1024  # refuse GPU load above this budget (4 GB total shared with Ollama)

market_ml:
  model_type: sgd-logloss
  features_version: feat-v1
  label_version: label-v1
  label_horizon_bars: 5
  label_threshold: 0.005
  hyperparams:
    alpha: 0.0001
    learning_rate: optimal
    eta0: 0.0
    random_state: 7
  preprocessing_version: prep-v1

training:
  device_policy: auto  # auto | cpu | cuda
  epochs: 5
  checkpoint_every_epochs: 1
  seed: 7
  max_samples: null
  out_dir: training_runs
  # Convergence (P1-2): solver sgd-logloss (legacy default, unchanged) or
  # logreg-lbfgs (batch fit to convergence). early_stopping_patience 0
  # preserves exact legacy fixed-epoch behavior; >0 stops on VAL plateau.
  solver: sgd-logloss
  lbfgs_max_iter: 1000
  early_stopping_patience: 0

registry:
  # New models enter as CANDIDATE and NEVER auto-activate. Explicit promote() only.
  initial_state: CANDIDATE
  gated_transitions:
    - [CANDIDATE, VALIDATED]
    - [VALIDATED, PAPER]
    - [PAPER, APPROVED]
    - [APPROVED, ACTIVE]

automation:
  # Orchestrator policy: single heavy job, small bounded experiment budget.
  max_experiments_per_cycle: 3
  max_concurrent_training: 1
  default_epochs: 5
  heartbeat_timeout_s: 600
  # Governance gates (deterministic; accuracy != profitability, backtest required).
  min_oos_edge_vs_baseline: 0.01
  max_backtest_drawdown_pct: 10.0
  require_backtest_completed: true
  # Walk-forward gate: rolling windows over the gate dataset. Thresholds are
  # explicit policy (not spec claims): median test Sharpe floor + all windows
  # must complete cleanly with disjoint test ranges (enforced by the engine).
  walkforward:
    enabled: true
    train_bars: 60
    test_bars: 20
    step_bars: 20
    max_windows: 4
    min_median_sharpe: 0.0
  # Stress gate: fixed reproducible scenarios (see backtest-gate.mjs).
  stress:
    enabled: true
    max_stressed_dd_pct: 10.0
  # Optional override for `aurix train` dataset discovery; when absent the
  # newest valid versioned dataset under data/datasets is used.
  # default_dataset_dir: null
  # Autonomous research bounds (Phase 1 research agent).
  research_max_total: 12
  research_max_per_cycle: 3
